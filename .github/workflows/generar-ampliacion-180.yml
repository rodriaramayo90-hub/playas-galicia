name: Generar ampliación a 180 playas

on:
  workflow_dispatch:
  push:
    paths:
      - "playas-extra.js"
      - "data/ampliacion-180-detalles-*.json"
      - "scripts/generar-ampliacion-180.mjs"
      - "mareas-ficha.js"
      - "mareas-ficha.css"
      - "plantillas/ficha-playa.html"
      - ".github/workflows/generar-ampliacion-180.yml"

permissions:
  contents: write

concurrency:
  group: generar-ampliacion-180-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  generar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generar fichas, índice y sitemap
        run: node scripts/generar-ampliacion-180.mjs

      - name: Aplicar módulo de mareas a las 180 fichas
        if: github.ref_name == 'preview-mareas-dinamicas'
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          paginas = sorted(Path('playas').glob('*/index.html'))
          if len(paginas) != 180:
              raise SystemExit(f'Se esperaban 180 fichas y se encontraron {len(paginas)}.')

          for pagina in paginas:
              html = pagina.read_text(encoding='utf-8')
              html = html.replace('../../marea-preview.css?v=1', '../../mareas-ficha.css?v=1')
              html = html.replace('../../marea-preview.js?v=1', '../../mareas-ficha.js?v=1')
              html = html.replace('<h2>Dependencia de la marea</h2>', '<h2>Información de mareas</h2>')

              if '../../mareas-ficha.css?v=1' not in html:
                  html, cambios = re.subn(
                      r'(<link rel="stylesheet" href="\.\./\.\./ficha-playa\.css\?v=[^"]+">)',
                      r'\1\n  <link rel="stylesheet" href="../../mareas-ficha.css?v=1">',
                      html,
                      count=1
                  )
                  if cambios != 1:
                      raise SystemExit(f'No se pudo insertar CSS de mareas en {pagina}.')

              if '../../mareas-ficha.js?v=1' not in html:
                  html, cambios = re.subn(
                      r'(<script src="\.\./\.\./ficha-playa\.js\?v=[^"]+"></script>)',
                      r'\1\n  <script src="../../mareas-ficha.js?v=1"></script>',
                      html,
                      count=1
                  )
                  if cambios != 1:
                      raise SystemExit(f'No se pudo insertar JS de mareas en {pagina}.')

              pagina.write_text(html, encoding='utf-8')

          for pagina in paginas:
              html = pagina.read_text(encoding='utf-8')
              if '../../mareas-ficha.js?v=1' not in html or '../../mareas-ficha.css?v=1' not in html:
                  raise SystemExit(f'Validación fallida en {pagina}.')

          print(f'Módulo de mareas aplicado y validado en {len(paginas)} fichas.')
          PY

      - name: Validar y corregir referencias de la portada
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          text = text.replace('buscador-playaya-control', 'buscador-playa-control')
          text = text.replace('nombre-playaya-tabla', 'nombre-playa-tabla')
          p.write_text(text, encoding='utf-8')
          PY

      - name: Validar catálogo SEO de 180 playas
        run: |
          node - <<'NODE'
          global.window = {};
          require('./data/indice-fichas.js');
          const total = Object.keys(window.HoyTocaPlayaIndiceFichas || {}).length;
          if (total !== 180) throw new Error(`El índice de fichas tiene ${total} playas; se esperaban 180.`);
          console.log(`Índice validado: ${total} playas.`);
          NODE
          python - <<'PY'
          from pathlib import Path
          sitemap = Path('sitemap.xml').read_text(encoding='utf-8')
          total = sitemap.count('<loc>')
          if total != 181:
              raise SystemExit(f'El sitemap tiene {total} URLs; se esperaban 181 (portada + 180 playas).')
          print(f'Sitemap validado: {total} URLs.')
          PY

      - name: Guardar ampliación y mareas en fichas
        run: |
          if git diff --quiet -- playas data/playas-detalle.json data/indice-fichas.js sitemap.xml index.html; then
            echo "La ampliación y las mareas ya están actualizadas."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add playas data/playas-detalle.json data/indice-fichas.js sitemap.xml index.html
          git commit -m "Generar fichas con mareas dinámicas"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
