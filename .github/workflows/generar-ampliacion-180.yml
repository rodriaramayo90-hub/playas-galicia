name: Generar ampliación a 180 playas

on:
  workflow_dispatch:
  push:
    paths:
      - "playas-extra.js"
      - "data/ampliacion-180-detalles-*.json"
      - "scripts/generar-ampliacion-180.mjs"
      - ".github/workflows/generar-ampliacion-180.yml"

permissions:
  contents: write

concurrency:
  group: generar-ampliacion-180
  cancel-in-progress: true

jobs:
  generar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generar fichas, índice y sitemap
        run: node scripts/generar-ampliacion-180.mjs

      - name: Validar y corregir referencias de la portada
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          text = text.replace('buscador-playaya-control', 'buscador-playa-control')
          text = text.replace('nombre-playaya-tabla', 'nombre-playa-tabla')
          p.write_text(text, encoding='utf-8')
          PY

      - name: Validar catálogo SEO de 180 playas
        run: |
          node - <<'NODE'
          global.window = {};
          require('./data/indice-fichas.js');
          const total = Object.keys(window.HoyTocaPlayaIndiceFichas || {}).length;
          if (total !== 180) throw new Error(`El índice de fichas tiene ${total} playas; se esperaban 180.`);
          console.log(`Índice validado: ${total} playas.`);
          NODE
          python - <<'PY'
          from pathlib import Path
          sitemap = Path('sitemap.xml').read_text(encoding='utf-8')
          total = sitemap.count('<loc>')
          if total != 181:
              raise SystemExit(f'El sitemap tiene {total} URLs; se esperaban 181 (portada + 180 playas).')
          print(f'Sitemap validado: {total} URLs.')
          PY

      - name: Guardar ampliación generada
        run: |
          if git diff --quiet -- playas data/playas-detalle.json data/indice-fichas.js sitemap.xml index.html; then
            echo "La ampliación ya está actualizada."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add playas data/playas-detalle.json data/indice-fichas.js sitemap.xml index.html
          git commit -m "Generar fichas enriquecidas para catálogo de 180 playas"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
