name: Actualizar pronóstico compartido

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar-pronostico
  cancel-in-progress: true

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Consultar Open-Meteo
        run: node scripts/actualizar-pronostico.mjs

      - name: Guardar pronóstico actualizado
        run: |
          if git diff --quiet -- data/pronostico.json; then
            echo "El pronóstico no cambió."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pronostico.json
          git commit -m "Actualizar pronóstico compartido"
          git push

