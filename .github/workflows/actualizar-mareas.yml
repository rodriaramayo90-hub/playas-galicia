name: Actualizar mareas

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/actualizar-mareas.mjs"
      - ".github/workflows/actualizar-mareas.yml"

permissions:
  contents: write

concurrency:
  group: actualizar-mareas
  cancel-in-progress: true

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Consultar mareas de MeteoGalicia
        run: node scripts/actualizar-mareas.mjs

      - name: Guardar mareas actualizadas
        run: |
          if git diff --quiet -- data/mareas.json; then
            echo "Las mareas no cambiaron."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/mareas.json
          git commit -m "Actualizar mareas diarias"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
