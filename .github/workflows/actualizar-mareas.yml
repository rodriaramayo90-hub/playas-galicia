name: Actualizar mareas

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/actualizar-mareas.mjs"
      - ".github/workflows/actualizar-mareas.yml"

permissions:
  contents: write

concurrency:
  group: actualizar-mareas-main
  cancel-in-progress: true

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Consultar mareas de MeteoGalicia
        run: node scripts/actualizar-mareas.mjs

      - name: Validar datos generados
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const datos = JSON.parse(await readFile('data/mareas.json', 'utf8'));
          const fechas = Object.keys(datos.dias || {});
          if (fechas.length < 2) throw new Error('Faltan los datos de hoy o mañana.');
          const hoy = datos.dias[fechas[0]];
          const vigo = hoy?.['3'];
          const coruna = hoy?.['1'];
          if (!vigo?.mareas?.length || !coruna?.mareas?.length) {
            throw new Error('Faltan los puertos de Vigo o A Coruña.');
          }
          if (vigo.mareas.length < 3 || coruna.mareas.length < 3) {
            throw new Error('MeteoGalicia devolvió un número insuficiente de mareas.');
          }
          console.log(`Validado ${fechas[0]}: Vigo ${vigo.mareas.map(m => `${m.tipo} ${m.hora}`).join(' · ')}`);
          console.log(`Validado ${fechas[0]}: A Coruña ${coruna.mareas.map(m => `${m.tipo} ${m.hora}`).join(' · ')}`);
          NODE

      - name: Guardar mareas actualizadas
        run: |
          if git diff --quiet -- data/mareas.json; then
            echo "Las mareas ya están actualizadas."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/mareas.json
          git commit -m "Actualizar mareas compartidas"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
