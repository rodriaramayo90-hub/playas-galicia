name: Temporary fix Valcovo index

on:
  push:
    branches:
      - corrige-indice-valcovo-v2

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: corrige-indice-valcovo-v2
          fetch-depth: 0
      - name: Update Valcovo index key
        shell: python
        run: |
          from pathlib import Path
          path = Path('data/indice-fichas.js')
          text = path.read_text(encoding='utf-8')
          old = '"Praia de Valcovo (Area Grande)||Arteixo": "praia-de-valcovo-area-grande",'
          new = '"Praia de Valcovo||Arteixo": "praia-de-valcovo-area-grande",'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one old Valcovo key, found {count}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8', newline='')
      - name: Commit change and remove temporary workflow
        run: |
          rm .github/workflows/temporary-fix-valcovo-index.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/indice-fichas.js .github/workflows/temporary-fix-valcovo-index.yml
          git diff --cached --check
          git commit -m "Corrige enlace de ficha de Valcovo"
          git push origin HEAD:corrige-indice-valcovo-v2
