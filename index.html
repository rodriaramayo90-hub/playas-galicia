<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mejores playas de Galicia</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles.css">
</head>

<body>

<h1>🏖️ Ranking diario de las mejores playas de Galicia</h1>

<div class="filtros">

<div class="filtros">

<button class="btn-ubicacion" onclick="obtenerUbicacionGPS()">
📍 Mi ubicación
</button>

<div class="grupo-filtro">

<label>Código postal</label>

<div class="input-con-boton">

<input
id="codigoPostal"
type="number"
placeholder="15002">

<button
class="btn-buscar"
onclick="buscarCodigoPostal(document.getElementById('codigoPostal').value)">
Buscar
</button>

</div>

</div>

<div class="grupo-filtro">

<label>Distancia máxima</label>

<div class="input-con-boton">

<input
id="distanciaMaxima"
list="distancias"
placeholder="Sin límite"
onchange="cambiarDistancia(this.value)">

<datalist id="distancias">

<option value="25">
<option value="50">
<option value="75">
<option value="100">
<option value="150">
<option value="200">
<option value="300">

</datalist>

<button class="btn-buscar" onclick="cargarRanking()">
Buscar
</button>

</div>

</div>

<div class="grupo-filtro">

<label>Vista</label>

<button
id="btnVista"
class="btn-vista"
onclick="cambiarVista()">
</button>

</div>

</div>
    
<div class="contenedor">

<div class="tabla-scroll">

<table>
<thead>
    <tr>
        <th>#</th>

<th onclick="cambiarOrden('nombre')">
Playa ↕
</th>

<th onclick="cambiarOrden('distancia')">
Distancia ↕
</th>

<th>Cielo</th>

<th onclick="cambiarOrden('temperaturaMaxima')" class="detalle">
T. Máx ↕
</th>

<th onclick="cambiarOrden('temperaturaMediaPlaya')">
T. Playa ↕
</th>

<th onclick="cambiarOrden('viento')" class="detalle">
Viento ↕
</th>

<th onclick="cambiarOrden('lluvia')" class="detalle">
Lluvia ↕
</th>

<th onclick="cambiarOrden('agua')" class="detalle">
Agua ↕
</th>

<th onclick="cambiarOrden('oleaje')" class="detalle">
Oleaje ↕
</th>

<th>Estado</th>

<th onclick="cambiarOrden('puntuacion')" class="detalle">
Puntaje ↕
</th>

<th>Explicación</th>
    </tr>
</thead>

<tbody id="ranking">
</tbody>

</table>

</div>
<div id="ranking-mobile"></div>
</div>
    

    <script src="app.js"></script>

</body>
</html>
