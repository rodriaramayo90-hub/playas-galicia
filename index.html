    <main>
        <section class="filtros" aria-label="Filtros del ranking">
            <div class="selector-dia" role="group" aria-label="Día del pronóstico">
                <button id="btnHoy" class="btn-dia activo" type="button" aria-pressed="true" onclick="cambiarDia(0)">Hoy</button>
                <button id="btnManana" class="btn-dia" type="button" aria-pressed="false" onclick="cambiarDia(1)">Mañana</button>
            </div>

            <button class="btn-ubicacion" type="button" onclick="obtenerUbicacionGPS()">📍 Mi ubicación</button>

            <div class="grupo-filtro">
                <label for="codigoPostal">Código postal</label>
                <input id="codigoPostal" type="text" inputmode="numeric" maxlength="5" pattern="[0-9]{5}" autocomplete="postal-code" placeholder="15002">
            </div>

            <div class="grupo-filtro">
                <label for="distanciaMaxima">Distancia máxima (km)</label>
                <div class="input-con-boton">
                    <input id="distanciaMaxima" type="number" min="1" step="1" list="distancias" placeholder="Sin límite">
                    <datalist id="distancias">
                        <option value="25"></option>
                        <option value="50"></option>
                        <option value="75"></option>
                        <option value="100"></option>
                        <option value="150"></option>
                        <option value="200"></option>
                        <option value="300"></option>
                    </datalist>
                    <button class="btn-buscar" type="button" onclick="aplicarBusqueda()">Buscar</button>
                </div>
            </div>

            <div class="grupo-filtro">
                <span class="etiqueta-grupo">Vista</span>
                <div class="input-con-boton">
                    <button id="btnVista" class="btn-vista" type="button" onclick="cambiarVista()" aria-label="Cambiar entre tabla y tarjetas">Cambiar vista</button>
                    <button id="btnDetalles" class="btn-vista" type="button" onclick="toggleDetalles()" aria-expanded="false">Ver detalles</button>
                </div>
            </div>
        </section>

        <p id="origenDistancia" class="origen-distancia" aria-live="polite" hidden></p>
        <p id="estadoCarga" class="estado-carga" role="status" aria-live="polite">Preparando el ranking…</p>

        <div class="contenedor">
            <div class="tabla-scroll" tabindex="0" aria-label="Ranking de playas; desliza horizontalmente para consultar todas las columnas">
                <table>
                    <caption class="sr-only">Ranking diario de playas gallegas según las condiciones previstas</caption>
                    <thead>
                        <tr>
                            <th scope="col">#</th>
                            <th scope="col" class="ordenable" tabindex="0" role="button" data-orden="nombre" onclick="cambiarOrden('nombre')">Playa ↕</th>
                            <th scope="col" class="ordenable" tabindex="0" role="button" data-orden="distancia" onclick="cambiarOrden('distancia')">Distancia ↕</th>
                            <th scope="col">Cielo</th>
                            <th scope="col" class="detalle ordenable" tabindex="0" role="button" data-orden="temperaturaMaxima" onclick="cambiarOrden('temperaturaMaxima')">T. Máx ↕</th>
                            <th scope="col" class="ordenable" tabindex="0" role="button" data-orden="temperaturaMediaPlaya" onclick="cambiarOrden('temperaturaMediaPlaya')">T. Playa ↕</th>
                            <th scope="col" class="detalle ordenable" tabindex="0" role="button" data-orden="viento" onclick="cambiarOrden('viento')">Viento ↕</th>
                            <th scope="col" class="detalle ordenable" tabindex="0" role="button" data-orden="lluvia" onclick="cambiarOrden('lluvia')">Lluvia ↕</th>
                            <th scope="col" class="detalle ordenable" tabindex="0" role="button" data-orden="agua" onclick="cambiarOrden('agua')">Agua ↕</th>
                            <th scope="col" class="detalle ordenable" tabindex="0" role="button" data-orden="oleaje" onclick="cambiarOrden('oleaje')">Oleaje ↕</th>
                            <th scope="col">Estado</th>
                            <th scope="col" class="detalle ordenable" tabindex="0" role="button" data-orden="puntuacion" onclick="cambiarOrden('puntuacion')">Puntaje ↕</th>
                            <th scope="col">Explicación</th>
                        </tr>
                    </thead>
                    <tbody id="ranking"></tbody>
                </table>
            </div>
            <div id="ranking-mobile" aria-label="Ranking de playas en tarjetas"></div>
        </div>
    </main>

    <noscript>Necesitas activar JavaScript para consultar el ranking actualizado.</noscript>
    <script src="app.js?v=2.8"></script>
